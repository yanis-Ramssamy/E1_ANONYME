   <main>
    <section class="formulaire">
      <h1 class="h2">Inscription à une formation</h1>
      <p>Les champs marqués d'une étoile (*) sont obligatoires.</p>
 
      <div id="message-succes" class="message-succes d-none" role="status"></div>
 
            <form id="formulaire-inscription" novalidate>
 
        <div class="mb-3">
          <label for="prenom" class="form-label">Prénom</label>
          <input type="text" id="prenom" class="form-control" required minlength="2">
          <span class="erreur-champ"></span>
        </div>
 
        <div class="mb-3">
          <label for="nom" class="form-label">Nom</label>
          <input type="text" id="nom" class="form-control" required minlength="2">
          <span class="erreur-champ"></span>
        </div>
 
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" required>
          <span class="erreur-champ"></span>
        </div>
 
        <div class="mb-3">
          <label for="telephone" class="form-label">Téléphone</label>
          <input type="tel" id="telephone" class="form-control" required
                 pattern="\+[0-9]{8,15}" placeholder="+33612345678">
          <span class="erreur-champ"></span>
        </div>
 
        <div class="mb-3">
          <label for="formation" class="form-label">Formation</label>
          <select id="formation" class="form-select" required>
            <option value="">Choisir une formation</option>
          </select>
          <span class="erreur-champ"></span>
        </div>
 
        <div class="mb-3">
          <label for="niveau" class="form-label">Niveau</label>
          <select id="niveau" class="form-select" required>
            <option value="">Choisir un niveau</option>
            <option>Débutant</option>
            <option>Intermédiaire</option>
            <option>Avancé</option>
          </select>
          <span class="erreur-champ"></span>
        </div>
 
        <div class="mb-3">
          <label for="motivation" class="form-label">Motivation (50 caractères minimum)</label>
          <textarea id="motivation" class="form-control" rows="4" required minlength="50"></textarea>
          <span class="erreur-champ"></span>
        </div>
 
        <button type="submit" class="btn btn-principal w-100">S'inscrire</button>
      </form>
>
